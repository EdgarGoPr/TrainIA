<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="70%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#007791"/>
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>
  
  <!-- Outer System Ring & Hexagon -->
  <polygon points="256,40 450,150 450,362 256,472 62,362 62,150" fill="none" stroke="url(#neon-cyan)" stroke-width="6" opacity="0.4" filter="url(#cyan-glow)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="16, 8" opacity="0.6"/>

  <!-- Glowing Dagger / System Rune Blade -->
  <g filter="url(#cyan-glow)">
    <!-- Blade -->
    <path d="M256,90 L290,260 L270,360 L256,400 L242,360 L222,260 Z" fill="url(#neon-cyan)"/>
    <!-- Blade core light -->
    <path d="M256,110 L272,255 L256,360 L240,255 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Crossguard -->
    <path d="M170,270 L342,270 L320,295 L192,295 Z" fill="#00e5ff"/>
    <!-- Pommel / Handle -->
    <rect x="246" y="295" width="20" height="90" rx="4" fill="#0b1221" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="256" cy="400" r="14" fill="#66fcf1"/>
  </g>

  <!-- System HUD Accents -->
  <text x="256" y="450" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#66fcf1" text-anchor="middle" letter-spacing="6" filter="url(#cyan-glow)">TRAIN IA</text>
</svg>
